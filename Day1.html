<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spelling Practice</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background:#fafafa; }
  h1 { color:#333; }
  .word-container { margin-bottom: 12px; }
  .word-button { padding:8px 12px; font-size:16px; margin-right:8px; border-radius:6px; }
  .check-button { padding:6px 10px; font-size:14px; border-radius:6px; }
  input { padding:5px; font-size:15px; }
  .score { font-size:18px; margin-top:20px; font-weight:bold; }
</style>
</head>
<body>
<h1>Spelling Practice</h1>
<div id="words"></div>
<div class="score" id="score">Score: 0 / 0</div>

<script>
const words = [
  "Desperate","Museum","Until","Eclipse","Achieve","Thief",
  "Elephant","Exercise","Freckles","Journey","Library","Hospital",
  "Biscuit","Scissors","Scarecrow","Coward","Dinosaur","Sandwich"
];
let correct = 0, attempted = 0;

// create buttons and inputs
const container = document.getElementById("words");
words.forEach((word, i) => {
  const div = document.createElement("div");
  div.className = "word-container";
  div.innerHTML = `
    <button class="word-button" id="word-btn-${i}" onclick="speak('${word}', ${i})">Word ${i+1}</button>
    <input type="text" id="input-${i}" placeholder="Type spelling here">
    <button class="check-button" onclick="check('${word}', ${i})">Check</button>
  `;
  container.appendChild(div);
});

function speak(word, idx) {
  const utterance = new SpeechSynthesisUtterance(word);
  speechSynthesis.speak(utterance);
  document.getElementById("word-btn-"+idx).style.backgroundColor = "";
}

function check(word, idx) {
  const input = document.getElementById("input-"+idx);
  const btn = document.getElementById("word-btn-"+idx);
  const guess = input.value.trim();
  attempted++;
  if (guess.toLowerCase() === word.toLowerCase()) {
    correct++;
    btn.style.backgroundColor = "lightgreen";
  } else {
    btn.style.backgroundColor = "lightcoral";
  }
  input.disabled = true;
  input.nextElementSibling.disabled = true;
  updateScore();
}

function updateScore() {
  document.getElementById("score").textContent = `Score: ${correct} / ${attempted}`;
}
</script>
</body>
</html>
